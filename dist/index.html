<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wildlands Survival</title>
  <!-- stylesheet resolved at runtime; Vite will warn if missing -->
  <style>
    body { margin: 0; overflow: hidden; font-family: 'Arial', sans-serif; background: #1a1a2e; }
    #three-canvas { width: 100%; height: 100%; }
    .hud { color: #fff; pointer-events: none; }
    .crosshair { position: absolute; width: 40px; height: 40px; top: 50%; left: 50%; margin: -20px 0 0 -20px; }
    .crosshair span { border: 2px solid #fff; display: block; position: absolute; left: 50%; top: 50%; margin: -6px 0 0 -6px; }
    .crosshair .horizontal { width: 20px; height: 12px; background: #fff; top: 50%; left: 50%; }
    .crosshair .vertical { width: 12px; height: 20px; background: #fff; top: 50%; left: 50%; }
    .inventory { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); padding: 20px; color: #fff; display: none; }
    .hotbar { position: fixed; bottom: 0; left: 0; right: 0; height: 40px; background: #222; border-top: 1px solid #444; display: flex; justify-content: space-around; align-items: center; }
    .hotbar-slot { width: 40px; height: 40px; background: #333; border: 2px solid #555; color: #fff; font-size: 12px; display: flex; justify-content: center; align-items: center; }
  </style>
  <script type="module" crossorigin src="/assets/index-cc3b6c0c.js"></script>
</head>
<body>
  <canvas id="three-canvas"></canvas>
  
  <div class="hud">
    <div class="crosshair">
      <span class="horizontal"></span>
      <span class="vertical"></span>
    </div>
    <div style="position: fixed; top: 20px; left: 20px;">
      <div style="font-size: 24px; font-weight: bold; text-shadow: 1px 1px 2px #000;">WILDLANDS</div>
      <div style="font-size: 12px; opacity: 0.7;">SURVIVAL</div>
      <div style="width: 150px; height: 15px; background: #2a2a3a; border-radius: 8px; overflow: hidden; margin-top: 8px;">
        <div id="health-bar" style="height: 100%; width: 100%; background: #ff4444; transition: width 0.05s linear;"></div>
      </div>
      <span style="font-size: 10px; position: relative; top: -13px; left: 5px; opacity: 0.8;">HEALTH</span>
    </div>
    <div style="position: fixed; top: 20px; right: 20px;">
      <div style="width: 120px; height: 15px; background: #2a2a3a; border-radius: 8px; overflow: hidden; margin-bottom: 5px;">
        <div id="hunger-bar" style="height: 100%; width: 100%; background: #e8c54a; transition: width 0.05s linear;"></div>
      </div>
      <span style="font-size: 10px; position: relative; top: -13px; left: 5px; opacity: 0.8;">HUNGER</span>
    </div>
    <div style="position: fixed; top: 20px; right: 20px; bottom: 200px;">
      <div style="width: 120px; height: 15px; background: #2a2a3a; border-radius: 8px; overflow: hidden; margin-bottom: 5px;">
        <div id="thirst-bar" style="height: 100%; width: 100%; background: #5dade2; transition: width 0.05s linear;"></div>
      </div>
      <span style="font-size: 10px; position: relative; top: -13px; left: 5px; opacity: 0.8;">THIRST</span>
    </div>
    <div style="position: fixed; bottom: 20px; left: 20px;">
      <div style="font-size: 12px; opacity: 0.7;">[WASD] Move | [SHIFT] Sprint | [SPACE] Jump | [E] Gather | [Q] Drink | [R] Berries | [F] Meat | [V] Bandage | [TAB] Inv | [C] Craft | [G] Campfire | [T] Cook | [U] Upgrade | [1-3] Build | [4-6] Tools | [J] Armor | [B] Stop</div>
    </div>
  </div>

  <div class="inventory" id="inventory">
    <div style="position: absolute; top: 20px; left: 20px; right: 20px; background: #2a2a3a; padding: 20px; border-radius: 8px; max-height: 400px; overflow: auto;">
      <div style="font-size: 18px; font-weight: bold; margin-bottom: 15px;">INVENTORY</div>
      <div style="display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; margin-bottom: 15px;">
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
      </div>
      <div style="display: grid; grid-template-columns: repeat(9, 1fr); gap: 8px; margin-top: 15px;">
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
        <div class="slot" style="background: #3a3a4a; height: 40px;"></div>
      </div>
    </div>
    <button style="position: absolute; top: 20px; right: 20px; background: #555; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer;" onclick="closeInventory()">Close</button>
  </div>

  <div class="hotbar">
    <div class="hotbar-slot" data-slot="1">1</div>
    <div class="hotbar-slot" data-slot="2">2</div>
    <div class="hotbar-slot" data-slot="3">3</div>
    <div class="hotbar-slot" data-slot="4">4</div>
    <div class="hotbar-slot" data-slot="5">5</div>
    <div class="hotbar-slot" data-slot="6">6</div>
    <div class="hotbar-slot" data-slot="7">7</div>
    <div class="hotbar-slot" data-slot="8">8</div>
    <div class="hotbar-slot" data-slot="9">9</div>
  </div>

  
</body>
</html>
